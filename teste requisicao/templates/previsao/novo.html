{% extends "previsao/base.html" %}
{% block title %}Nova Previsão{% endblock %}
{% block conteudo %}
<!-- BLOCO: FORMULÁRIO MANUAL. Setor é obrigatório para garantir rastreabilidade. -->
<div class="cartao prev-form">
  <div class="cartao-cabecalho"><h3>Nova previsão</h3></div>
  <form id="formPrevisao" class="prev-form-grid">
    <label>Setor *<select name="setor" required><option value="">Selecione</option>{% for setor in setores %}<option>{{ setor }}</option>{% endfor %}</select></label>
    <label>Competência *<input type="date" name="competencia" required></label>
    <label>CIA<input name="cia" placeholder="Ex.: 221"></label>
    <label>Fornecedor<input name="fornecedor"></label>
    <label>Vencimento<input type="date" name="vencimento"></label>
    <label>Valor previsto *<input name="valor" inputmode="decimal" placeholder="0,00" required></label>
    <label class="campo-largo">Referência do serviço/produto<textarea name="referencia" rows="3"></textarea></label>
    <label>Classificação *<select name="classificacao" required><option value="">Selecione</option>{% for c in classificacoes %}<option>{{ c.nome }}</option>{% endfor %}</select></label>
    <label class="campo-largo">Observação<textarea name="observacao" rows="3"></textarea></label>
    <div class="campo-largo prev-acoes"><button type="submit" class="btn btn-primario">Salvar previsão</button><a href="{{ url_for('previsao.index') }}" class="btn btn-neutro">Cancelar</a></div>
  </form>
</div>
{% endblock %}
